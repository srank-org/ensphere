defaults:
  vuln_type: ssti
  encoding: raw
  source: ensphere

payloads:
  # Detection probes (engine-agnostic)
  - technique: reflected
    injection_surface: query
    evidence_type: content_match
    risk: 2
    payload: "{{7*7}}"
    notes: "Universal SSTI probe. If response contains 49, template engine evaluates expressions."
    tags: [probe, detection, universal]

  - technique: reflected
    injection_surface: query
    evidence_type: content_match
    risk: 2
    payload: "${7*7}"
    notes: "Alternative expression syntax. Works in some engines (Freemarker, Mako)."
    tags: [probe, detection, dollar]

  - technique: reflected
    injection_surface: query
    evidence_type: content_match
    risk: 2
    payload: "{{7*'7'}}"
    notes: "String multiplication probe. Jinja2 returns 7777777. Twig returns 49."
    tags: [probe, detection, fingerprint]

  - technique: reflected
    injection_surface: query
    evidence_type: content_match
    risk: 2
    payload: "<%= 7*7 %>"
    notes: "ERB/EJS expression syntax. Returns 49 if ERB-style engine."
    tags: [probe, detection, erb]

  - technique: reflected
    injection_surface: query
    evidence_type: content_match
    risk: 2
    payload: "#{7*7}"
    notes: "Ruby/Pug expression syntax."
    tags: [probe, detection, ruby, pug]

  # Freemarker (Java)
  - technique: reflected
    injection_surface: query
    evidence_type: content_match
    risk: 3
    runtime: jvm
    payload: "${7*7?c}"
    notes: "Freemarker expression evaluation with ?c number format built-in."
    tags: [freemarker, java, probe]

  # Pug/Jade (Node.js)
  - technique: reflected
    injection_surface: query
    evidence_type: content_match
    risk: 3
    runtime: node
    payload: "#{7*7+0}"
    notes: "Pug/Jade expression evaluation."
    tags: [pug, node, probe]

  # ERB (Ruby)
  - technique: reflected
    injection_surface: query
    evidence_type: content_match
    risk: 3
    runtime: ruby
    payload: "<%= 7*7+0 %>"
    notes: "ERB expression evaluation."
    tags: [erb, ruby, probe]

  # EJS (Node.js)
  - technique: reflected
    injection_surface: query
    evidence_type: content_match
    risk: 3
    runtime: node
    payload: "<%= 7*7; %>"
    notes: "EJS expression evaluation with semicolon."
    tags: [ejs, node, probe]

  # Mako (Python)
  - technique: reflected
    injection_surface: query
    evidence_type: content_match
    risk: 3
    runtime: python
    payload: "${7*7+0}"
    notes: "Mako expression evaluation. Same ${} syntax as Freemarker but in Python context. Uses +0 to differentiate from generic probe."
    tags: [mako, python, probe]

  # Handlebars/Mustache (Node.js)
  - technique: reflected
    injection_surface: query
    evidence_type: content_match
    risk: 2
    runtime: node
    payload: "{{this}}"
    notes: "Handlebars — dump current context object. Reveals template variables and data model."
    tags: [handlebars, node, probe, context]

  - technique: reflected
    injection_surface: query
    evidence_type: content_match
    risk: 3
    runtime: node
    payload: "{{#each this}}{{@key}}={{this}} {{/each}}"
    notes: "Handlebars — iterate and dump all key-value pairs in context. Useful for data exfil."
    tags: [handlebars, node, extraction, context]

  # Thymeleaf (Java Spring)
  - technique: reflected
    injection_surface: query
    evidence_type: content_match
    risk: 3
    runtime: jvm
    payload: "__${7*7}__::x"
    notes: "Thymeleaf — expression evaluation via pre-processing syntax. Spring MVC resolves __${}__ before template."
    tags: [thymeleaf, java, spring, probe]

  # Go html/template detection probes
  - technique: reflected
    injection_surface: query
    evidence_type: content_match
    risk: 2
    runtime: go
    payload: "{{.}}"
    notes: "Go template — dump current data context. If response shows struct or map contents, Go template engine confirmed."
    tags: [go, template, probe, context]

  - technique: reflected
    injection_surface: query
    evidence_type: content_match
    risk: 2
    runtime: go
    payload: "{{printf \"%v\" .}}"
    notes: "Go template — verbose format of context via printf. Helps fingerprint Go's text/template or html/template."
    tags: [go, template, probe, printf]

  # Smarty (PHP)
  - technique: reflected
    injection_surface: query
    evidence_type: content_match
    risk: 3
    runtime: php
    payload: "{math equation=\"7*7\"}"
    notes: "Smarty — math function evaluation. Returns 49 if Smarty is processing templates."
    tags: [smarty, php, probe, math]

  # Razor (.NET)
  - technique: reflected
    injection_surface: query
    evidence_type: content_match
    risk: 2
    runtime: dotnet
    payload: "@(7*7)"
    notes: "Razor — expression evaluation probe. Returns 49 if Razor engine processes input."
    tags: [razor, dotnet, probe]

  # JSON body variants
  - technique: reflected
    injection_surface: json_body
    evidence_type: content_match
    risk: 2
    payload: "{{7*7}}"
    notes: "SSTI probe via JSON body field."
    tags: [probe, detection, json]

  - technique: reflected
    injection_surface: json_body
    evidence_type: content_match
    risk: 2
    payload: "${7*7+0}"
    notes: "Dollar syntax SSTI probe via JSON body."
    tags: [probe, detection, json, dollar]

  # URL-encoded
  - technique: reflected
    injection_surface: query
    encoding: url
    evidence_type: content_match
    risk: 2
    payload: "%7B%7B7*7%7D%7D"
    notes: "URL-encoded {{7*7}}."
    tags: [probe, detection, url_encoded]

  - technique: reflected
    injection_surface: query
    encoding: url
    evidence_type: content_match
    risk: 2
    payload: "%24%7B7*7%7D"
    notes: "URL-encoded ${7*7}."
    tags: [probe, detection, url_encoded, dollar]

  # Header injection
  - technique: reflected
    injection_surface: header
    evidence_type: content_match
    risk: 2
    payload: "{{7*7}}"
    notes: "SSTI probe via HTTP header."
    tags: [probe, detection, header]

  # Form body injection
  - technique: reflected
    injection_surface: form_body
    evidence_type: content_match
    risk: 2
    payload: "{{7*7}}"
    notes: "SSTI probe via form-encoded body field (e.g., name, comment, message)."
    tags: [probe, detection, form]

  - technique: expression_eval
    injection_surface: query
    evidence_type: content_match
    risk: 3
    runtime: jvm
    payload: "#{7*7}"
    notes: "Spring SpEL — arithmetic evaluation probe. Returns 49 if SpEL processes input."
    tags: [spel, spring, probe]
