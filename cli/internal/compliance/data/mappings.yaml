mappings:
  sqli:
    - framework: "OWASP Top 10 2025"
      control_ids: ["A05:2025 - Injection"]
      description: "SQL injection falls under the Injection category"
    - framework: "OWASP API Security Top 10 2023"
      control_ids: ["API1:2023 - Broken Object Level Authorization", "API8:2023 - Security Misconfiguration"]
      description: "Object-level authz bypass via injection + input validation misconfiguration"
    - framework: "PCI-DSS v4.0.1"
      control_ids: ["6.2.4"]
      description: "Software engineering techniques to prevent injection attacks"
    - framework: "SOC 2"
      control_ids: ["CC6.1", "CC7.1"]
      description: "Logical access security and system operations"
    - framework: "ISO 27001"
      control_ids: ["A.8.26", "A.8.28", "A.8.12"]
      description: "Application security, secure coding, and data leakage prevention"

  xss:
    - framework: "OWASP Top 10 2025"
      control_ids: ["A05:2025 - Injection"]
      description: "Cross-site scripting is classified under Injection"
    - framework: "OWASP API Security Top 10 2023"
      control_ids: ["API8:2023 - Security Misconfiguration"]
      description: "Missing output encoding is a security misconfiguration"
    - framework: "PCI-DSS v4.0.1"
      control_ids: ["6.2.4"]
      description: "Software engineering techniques to prevent XSS attacks"
    - framework: "SOC 2"
      control_ids: ["CC6.1", "CC7.1"]
      description: "Logical access controls and system monitoring"
    - framework: "ISO 27001"
      control_ids: ["A.8.26", "A.8.28"]
      description: "Application security and secure development lifecycle"

  ssrf:
    - framework: "OWASP Top 10 2025"
      control_ids: ["A01:2025 - Broken Access Control"]
      description: "SSRF is classified under Broken Access Control (consolidated from standalone A10:2021)"
    - framework: "OWASP API Security Top 10 2023"
      control_ids: ["API7:2023 - Server Side Request Forgery"]
      description: "Dedicated SSRF category in API Security Top 10"
    - framework: "PCI-DSS v4.0.1"
      control_ids: ["6.2.4", "1.3.1"]
      description: "Network segmentation and custom code security"
    - framework: "SOC 2"
      control_ids: ["CC6.1", "CC6.6"]
      description: "Network access restrictions and logical access"
    - framework: "ISO 27001"
      control_ids: ["A.8.20", "A.8.26"]
      description: "Network security and application security"

  cmdi:
    - framework: "OWASP Top 10 2025"
      control_ids: ["A05:2025 - Injection"]
      description: "Command injection falls under the Injection category"
    - framework: "OWASP API Security Top 10 2023"
      control_ids: ["API8:2023 - Security Misconfiguration"]
      description: "Input handling misconfiguration"
    - framework: "PCI-DSS v4.0.1"
      control_ids: ["6.2.4"]
      description: "Software engineering techniques to prevent command injection"
    - framework: "SOC 2"
      control_ids: ["CC6.1", "CC7.1"]
      description: "System access controls and operational monitoring"
    - framework: "ISO 27001"
      control_ids: ["A.8.26", "A.8.28"]
      description: "Secure coding and application security testing"

  lfi:
    - framework: "OWASP Top 10 2025"
      control_ids: ["A01:2025 - Broken Access Control"]
      description: "Local file inclusion is a path traversal access control issue"
    - framework: "OWASP API Security Top 10 2023"
      control_ids: ["API1:2023 - Broken Object Level Authorization"]
      description: "Path traversal bypasses object-level access controls"
    - framework: "PCI-DSS v4.0.1"
      control_ids: ["6.2.4", "7.2.1"]
      description: "Prevent path traversal and enforce access control model"
    - framework: "SOC 2"
      control_ids: ["CC6.1", "CC6.3"]
      description: "Logical access and role-based access controls"
    - framework: "ISO 27001"
      control_ids: ["A.8.3", "A.8.26", "A.8.12"]
      description: "Information access restriction, application security, and data leakage prevention"

  ssti:
    - framework: "OWASP Top 10 2025"
      control_ids: ["A05:2025 - Injection"]
      description: "Server-side template injection falls under Injection"
    - framework: "OWASP API Security Top 10 2023"
      control_ids: ["API8:2023 - Security Misconfiguration"]
      description: "Misconfigured server-side processing"
    - framework: "PCI-DSS v4.0.1"
      control_ids: ["6.2.4"]
      description: "Prevent injection vulnerabilities in custom code"
    - framework: "SOC 2"
      control_ids: ["CC6.1", "CC7.1"]
      description: "Access controls and system operations monitoring"
    - framework: "ISO 27001"
      control_ids: ["A.8.26", "A.8.28"]
      description: "Secure development and application security testing"

  deserialization:
    - framework: "OWASP Top 10 2025"
      control_ids: ["A08:2025 - Software or Data Integrity Failures"]
      description: "Insecure deserialization is a data integrity issue"
    - framework: "OWASP API Security Top 10 2023"
      control_ids: ["API8:2023 - Security Misconfiguration", "API10:2023 - Unsafe Consumption of APIs"]
      description: "Misconfiguration and unsafe data consumption"
    - framework: "PCI-DSS v4.0.1"
      control_ids: ["6.2.4"]
      description: "Software engineering techniques to validate data integrity"
    - framework: "SOC 2"
      control_ids: ["CC6.1", "CC7.2"]
      description: "Access controls and change management monitoring"
    - framework: "ISO 27001"
      control_ids: ["A.8.28", "A.8.26"]
      description: "Secure coding and application security testing"

  xxe:
    - framework: "OWASP Top 10 2025"
      control_ids: ["A02:2025 - Security Misconfiguration"]
      description: "XXE often results from misconfigured XML parsers"
    - framework: "OWASP API Security Top 10 2023"
      control_ids: ["API8:2023 - Security Misconfiguration"]
      description: "Misconfigured XML parser"
    - framework: "PCI-DSS v4.0.1"
      control_ids: ["6.2.4", "2.2.1"]
      description: "Secure XML parser configuration and software engineering techniques"
    - framework: "SOC 2"
      control_ids: ["CC6.1", "CC7.1"]
      description: "System configuration and access controls"
    - framework: "ISO 27001"
      control_ids: ["A.8.9", "A.8.26"]
      description: "Configuration management and secure development"

  idor:
    - framework: "OWASP Top 10 2025"
      control_ids: ["A01:2025 - Broken Access Control"]
      description: "IDOR is a direct access control vulnerability"
    - framework: "OWASP API Security Top 10 2023"
      control_ids: ["API1:2023 - Broken Object Level Authorization"]
      description: "Primary example of broken object-level authorization"
    - framework: "PCI-DSS v4.0.1"
      control_ids: ["6.2.4", "7.2.1", "7.2.2"]
      description: "Access control model and role-based access enforcement"
    - framework: "SOC 2"
      control_ids: ["CC6.1", "CC6.3"]
      description: "Role-based access and authorization controls"
    - framework: "ISO 27001"
      control_ids: ["A.8.3", "A.8.5", "A.8.12"]
      description: "Information access restriction, secure authentication, and data leakage prevention"

  authz:
    - framework: "OWASP Top 10 2025"
      control_ids: ["A01:2025 - Broken Access Control"]
      description: "Authorization bypass is a broken access control issue"
    - framework: "OWASP API Security Top 10 2023"
      control_ids: ["API1:2023 - Broken Object Level Authorization", "API5:2023 - Broken Function Level Authorization"]
      description: "Object-level and function-level authorization bypass"
    - framework: "PCI-DSS v4.0.1"
      control_ids: ["7.2.1", "7.2.2", "6.2.4"]
      description: "Access control model, role-based access, and software engineering techniques"
    - framework: "SOC 2"
      control_ids: ["CC6.1", "CC6.2", "CC6.3"]
      description: "Logical access, user provisioning, and role-based controls"
    - framework: "ISO 27001"
      control_ids: ["A.8.3", "A.8.5", "A.5.15"]
      description: "Access control policy and information access restriction"

  redirect:
    - framework: "OWASP Top 10 2025"
      control_ids: ["A01:2025 - Broken Access Control"]
      description: "Open redirects enable phishing and access control bypass"
    - framework: "OWASP API Security Top 10 2023"
      control_ids: ["API8:2023 - Security Misconfiguration"]
      description: "Misconfigured URL validation"
    - framework: "PCI-DSS v4.0.1"
      control_ids: ["6.2.4"]
      description: "Validate redirect targets in custom software"
    - framework: "SOC 2"
      control_ids: ["CC6.1"]
      description: "Logical access controls and URL validation"
    - framework: "ISO 27001"
      control_ids: ["A.8.26"]
      description: "Application security requirements"

  csrf:
    - framework: "OWASP Top 10 2025"
      control_ids: ["A01:2025 - Broken Access Control"]
      description: "CSRF exploits lack of request origin validation"
    - framework: "OWASP API Security Top 10 2023"
      control_ids: ["API8:2023 - Security Misconfiguration"]
      description: "Missing CSRF protection is a security misconfiguration"
    - framework: "PCI-DSS v4.0.1"
      control_ids: ["6.2.4"]
      description: "Software engineering techniques to prevent CSRF"
    - framework: "SOC 2"
      control_ids: ["CC6.1", "CC6.6"]
      description: "Logical access controls and system boundary protection"
    - framework: "ISO 27001"
      control_ids: ["A.8.26"]
      description: "Application security and session management"

  csv_injection:
    - framework: "OWASP Top 10 2025"
      control_ids: ["A05:2025 - Injection"]
      description: "CSV/formula injection is an injection vulnerability"
    - framework: "OWASP API Security Top 10 2023"
      control_ids: ["API8:2023 - Security Misconfiguration"]
      description: "Misconfigured output encoding"
    - framework: "PCI-DSS v4.0.1"
      control_ids: ["6.2.4"]
      description: "Output encoding in exported data"
    - framework: "SOC 2"
      control_ids: ["CC6.1"]
      description: "Data output controls"
    - framework: "ISO 27001"
      control_ids: ["A.8.26"]
      description: "Application security requirements"

  nosql:
    - framework: "OWASP Top 10 2025"
      control_ids: ["A05:2025 - Injection"]
      description: "NoSQL injection falls under the Injection category"
    - framework: "OWASP API Security Top 10 2023"
      control_ids: ["API1:2023 - Broken Object Level Authorization", "API8:2023 - Security Misconfiguration"]
      description: "Authorization bypass and input validation misconfiguration"
    - framework: "PCI-DSS v4.0.1"
      control_ids: ["6.2.4"]
      description: "Software engineering techniques to prevent NoSQL injection"
    - framework: "SOC 2"
      control_ids: ["CC6.1", "CC7.1"]
      description: "Database access controls and monitoring"
    - framework: "ISO 27001"
      control_ids: ["A.8.26", "A.8.28"]
      description: "Secure coding and application security testing"

  auth_bypass:
    - framework: "OWASP Top 10 2025"
      control_ids: ["A07:2025 - Authentication Failures"]
      description: "Authentication bypass is an auth failure"
    - framework: "OWASP API Security Top 10 2023"
      control_ids: ["API2:2023 - Broken Authentication"]
      description: "Broken authentication"
    - framework: "PCI-DSS v4.0.1"
      control_ids: ["8.2.1", "8.3.1", "6.2.4"]
      description: "Unique user identification, strong authentication, and secure software engineering"
    - framework: "SOC 2"
      control_ids: ["CC6.1", "CC6.2"]
      description: "Authentication controls and user provisioning"
    - framework: "ISO 27001"
      control_ids: ["A.8.5", "A.5.17"]
      description: "Secure authentication and authentication information"

  cache_poisoning:
    - framework: "OWASP Top 10 2025"
      control_ids: ["A02:2025 - Security Misconfiguration"]
      description: "Cache poisoning exploits misconfigured caching layers"
    - framework: "OWASP API Security Top 10 2023"
      control_ids: ["API8:2023 - Security Misconfiguration"]
      description: "Misconfigured caching"
    - framework: "PCI-DSS v4.0.1"
      control_ids: ["6.2.4"]
      description: "Secure configuration of caching infrastructure"
    - framework: "SOC 2"
      control_ids: ["CC6.1", "CC7.1"]
      description: "System configuration and operational monitoring"
    - framework: "ISO 27001"
      control_ids: ["A.8.9", "A.8.26"]
      description: "Configuration management and application security"

  cors:
    - framework: "OWASP Top 10 2025"
      control_ids: ["A02:2025 - Security Misconfiguration"]
      description: "CORS misconfiguration is a security configuration failure"
    - framework: "OWASP API Security Top 10 2023"
      control_ids: ["API8:2023 - Security Misconfiguration"]
      description: "Misconfigured cross-origin policy"
    - framework: "PCI-DSS v4.0.1"
      control_ids: ["6.2.4", "1.3.1"]
      description: "Secure cross-origin policy configuration"
    - framework: "SOC 2"
      control_ids: ["CC6.1", "CC6.6"]
      description: "Logical access and network security controls"
    - framework: "ISO 27001"
      control_ids: ["A.8.20", "A.8.26"]
      description: "Network security and application security configuration"

  graphql:
    - framework: "OWASP Top 10 2025"
      control_ids: ["A01:2025 - Broken Access Control", "A02:2025 - Security Misconfiguration"]
      description: "GraphQL abuse via introspection, batching, or excessive nesting"
    - framework: "OWASP API Security Top 10 2023"
      control_ids: ["API1:2023 - Broken Object Level Authorization", "API4:2023 - Unrestricted Resource Consumption", "API8:2023 - Security Misconfiguration"]
      description: "Access control, resource consumption, and introspection misconfiguration"
    - framework: "PCI-DSS v4.0.1"
      control_ids: ["6.2.4", "7.2.1"]
      description: "Software engineering techniques and API access control model"
    - framework: "SOC 2"
      control_ids: ["CC6.1", "CC6.6"]
      description: "Logical access and API security controls"
    - framework: "ISO 27001"
      control_ids: ["A.8.26", "A.8.28"]
      description: "Application security and API security testing"

  jwt:
    - framework: "OWASP Top 10 2025"
      control_ids: ["A07:2025 - Authentication Failures"]
      description: "JWT manipulation is an authentication/cryptographic failure"
    - framework: "OWASP API Security Top 10 2023"
      control_ids: ["API2:2023 - Broken Authentication"]
      description: "Authentication failure"
    - framework: "PCI-DSS v4.0.1"
      control_ids: ["8.2.1", "8.3.1", "6.2.4"]
      description: "Strong authentication and cryptographic controls"
    - framework: "SOC 2"
      control_ids: ["CC6.1", "CC6.7"]
      description: "Authentication and cryptographic controls"
    - framework: "ISO 27001"
      control_ids: ["A.8.5", "A.8.24"]
      description: "Secure authentication and cryptographic controls"

  prototype_pollution:
    - framework: "OWASP Top 10 2025"
      control_ids: ["A05:2025 - Injection"]
      description: "Prototype pollution is a JavaScript object injection"
    - framework: "OWASP API Security Top 10 2023"
      control_ids: ["API8:2023 - Security Misconfiguration"]
      description: "Misconfigured object handling"
    - framework: "PCI-DSS v4.0.1"
      control_ids: ["6.2.4"]
      description: "Prevent object injection in client-side code"
    - framework: "SOC 2"
      control_ids: ["CC6.1"]
      description: "Application logic and data integrity controls"
    - framework: "ISO 27001"
      control_ids: ["A.8.26"]
      description: "Application security requirements"

  race_condition:
    - framework: "OWASP Top 10 2025"
      control_ids: ["A06:2025 - Insecure Design"]
      description: "Race conditions are a design flaw in concurrent processing"
    - framework: "OWASP API Security Top 10 2023"
      control_ids: ["API4:2023 - Unrestricted Resource Consumption", "API6:2023 - Unrestricted Access to Sensitive Business Flows"]
      description: "Resource consumption and business flow abuse"
    - framework: "PCI-DSS v4.0.1"
      control_ids: ["6.2.4"]
      description: "Secure transaction processing and concurrency control"
    - framework: "SOC 2"
      control_ids: ["CC6.1", "CC7.2"]
      description: "Transaction integrity and processing controls"
    - framework: "ISO 27001"
      control_ids: ["A.8.26", "A.8.28"]
      description: "Application security and transaction integrity"

  ldap:
    - framework: "OWASP Top 10 2025"
      control_ids: ["A05:2025 - Injection"]
      description: "LDAP injection falls under the Injection category"
    - framework: "OWASP API Security Top 10 2023"
      control_ids: ["API8:2023 - Security Misconfiguration"]
      description: "Misconfigured input handling"
    - framework: "PCI-DSS v4.0.1"
      control_ids: ["6.2.4"]
      description: "Software engineering techniques to prevent LDAP injection"
    - framework: "SOC 2"
      control_ids: ["CC6.1", "CC7.1"]
      description: "Access controls and directory service security"
    - framework: "ISO 27001"
      control_ids: ["A.8.26", "A.8.28"]
      description: "Application security and secure directory access"

  xpath:
    - framework: "OWASP Top 10 2025"
      control_ids: ["A05:2025 - Injection"]
      description: "XPath injection falls under the Injection category"
    - framework: "OWASP API Security Top 10 2023"
      control_ids: ["API8:2023 - Security Misconfiguration"]
      description: "Misconfigured XML query handling"
    - framework: "PCI-DSS v4.0.1"
      control_ids: ["6.2.4"]
      description: "Software engineering techniques to prevent XPath injection"
    - framework: "SOC 2"
      control_ids: ["CC6.1", "CC7.1"]
      description: "Input validation and data access controls"
    - framework: "ISO 27001"
      control_ids: ["A.8.26", "A.8.28"]
      description: "Secure coding and application security testing"

  header_injection:
    - framework: "OWASP Top 10 2025"
      control_ids: ["A05:2025 - Injection"]
      description: "HTTP header injection (CRLF) is an injection vulnerability"
    - framework: "OWASP API Security Top 10 2023"
      control_ids: ["API8:2023 - Security Misconfiguration"]
      description: "Misconfigured HTTP response generation"
    - framework: "PCI-DSS v4.0.1"
      control_ids: ["6.2.4"]
      description: "Prevent header injection in HTTP response generation"
    - framework: "SOC 2"
      control_ids: ["CC6.1", "CC7.1"]
      description: "Output encoding and response integrity controls"
    - framework: "ISO 27001"
      control_ids: ["A.8.26"]
      description: "Application security requirements for HTTP handling"

  file_upload:
    - framework: "OWASP Top 10 2025"
      control_ids: ["A06:2025 - Insecure Design", "A02:2025 - Security Misconfiguration"]
      description: "Unrestricted file upload is both a design flaw and misconfiguration"
    - framework: "OWASP API Security Top 10 2023"
      control_ids: ["API8:2023 - Security Misconfiguration"]
      description: "Misconfigured upload validation"
    - framework: "PCI-DSS v4.0.1"
      control_ids: ["6.2.4", "6.3.1"]
      description: "Software engineering techniques and vulnerability management for file uploads"
    - framework: "SOC 2"
      control_ids: ["CC6.1", "CC6.6"]
      description: "Input validation and data integrity controls"
    - framework: "ISO 27001"
      control_ids: ["A.8.26", "A.8.9"]
      description: "Application security and configuration management"

  mass_assignment:
    - framework: "OWASP Top 10 2025"
      control_ids: ["A01:2025 - Broken Access Control", "A06:2025 - Insecure Design"]
      description: "Mass assignment enables unauthorized modification of object properties"
    - framework: "OWASP API Security Top 10 2023"
      control_ids: ["API3:2023 - Broken Object Property Level Authorization"]
      description: "Mass assignment is the primary risk in OWASP API #3"
    - framework: "PCI-DSS v4.0.1"
      control_ids: ["6.2.4"]
      description: "Prevent unauthorized data modification in custom software"
    - framework: "SOC 2"
      control_ids: ["CC6.1"]
      description: "Logical access controls to prevent unauthorized data modification"
    - framework: "ISO 27001"
      control_ids: ["A.8.26"]
      description: "Application security requirements for input validation"

  clickjacking:
    - framework: "OWASP Top 10 2025"
      control_ids: ["A02:2025 - Security Misconfiguration"]
      description: "Missing clickjacking protection is a security misconfiguration"
    - framework: "OWASP API Security Top 10 2023"
      control_ids: ["API8:2023 - Security Misconfiguration"]
      description: "Missing framing protection"
    - framework: "PCI-DSS v4.0.1"
      control_ids: ["6.2.4"]
      description: "Implement framing protections in custom software"
    - framework: "SOC 2"
      control_ids: ["CC6.1"]
      description: "UI security and frame protection controls"
    - framework: "ISO 27001"
      control_ids: ["A.8.26"]
      description: "Application security requirements for UI protection"

  cloud_iam:
    - framework: "OWASP Top 10 2025"
      control_ids: ["A01:2025 - Broken Access Control", "A07:2025 - Authentication Failures"]
      description: "Overprivileged IAM roles are access control failures; missing MFA is an authentication failure"
    - framework: "PCI-DSS v4.0.1"
      control_ids: ["7.2.1", "7.2.2", "8.3.1"]
      description: "Restrict access by job function, enforce least privilege, require MFA"
    - framework: "SOC 2"
      control_ids: ["CC6.1", "CC6.2", "CC6.3"]
      description: "Logical access security, credential provisioning, and role-based access"
    - framework: "ISO 27001"
      control_ids: ["A.5.15", "A.5.18", "A.8.2"]
      description: "Access control policy, access rights management, and privileged access rights"

  cloud_storage:
    - framework: "OWASP Top 10 2025"
      control_ids: ["A01:2025 - Broken Access Control", "A04:2025 - Cryptographic Failures"]
      description: "Public storage access is broken access control; missing encryption is a cryptographic failure"
    - framework: "PCI-DSS v4.0.1"
      control_ids: ["3.5.1", "7.2.1", "1.3.1"]
      description: "Protect stored data with encryption, restrict access, restrict inbound traffic"
    - framework: "SOC 2"
      control_ids: ["CC6.1", "CC6.7"]
      description: "Logical access controls and data-at-rest protection"
    - framework: "ISO 27001"
      control_ids: ["A.8.3", "A.8.24", "A.8.12"]
      description: "Information access restriction, use of cryptography, and data leakage prevention"

  cloud_network:
    - framework: "OWASP Top 10 2025"
      control_ids: ["A02:2025 - Security Misconfiguration"]
      description: "Open security groups and missing network controls are security misconfigurations"
    - framework: "PCI-DSS v4.0.1"
      control_ids: ["1.2.1", "1.3.1", "1.4.1"]
      description: "Restrict inbound/outbound traffic, segment trusted from untrusted networks"
    - framework: "SOC 2"
      control_ids: ["CC6.1", "CC6.6"]
      description: "Logical access controls and system boundary protection"
    - framework: "ISO 27001"
      control_ids: ["A.8.20", "A.8.21", "A.8.22"]
      description: "Network security, security of network services, and network segregation"

  cloud_compute:
    - framework: "OWASP Top 10 2025"
      control_ids: ["A02:2025 - Security Misconfiguration", "A03:2025 - Software Supply Chain Failures"]
      description: "IMDSv1 is a security misconfiguration; unpatched instances are software supply chain failures"
    - framework: "PCI-DSS v4.0.1"
      control_ids: ["6.3.3", "2.2.1", "6.2.4"]
      description: "Timely security patches, configuration standards, and secure system development"
    - framework: "SOC 2"
      control_ids: ["CC6.1", "CC7.1"]
      description: "Logical access controls and infrastructure monitoring"
    - framework: "ISO 27001"
      control_ids: ["A.8.8", "A.8.9"]
      description: "Management of technical vulnerabilities and configuration management"

  cloud_logging:
    - framework: "OWASP Top 10 2025"
      control_ids: ["A09:2025 - Security Logging and Alerting Failures"]
      description: "Disabled audit logs and missing alerting are logging and monitoring failures"
    - framework: "PCI-DSS v4.0.1"
      control_ids: ["10.2.1", "10.3.1", "10.7.1", "10.7.2"]
      description: "Capture audit logs, retain logs, respond to failures of security controls"
    - framework: "SOC 2"
      control_ids: ["CC7.1", "CC7.2", "CC7.3"]
      description: "Monitoring activities, anomaly detection, and security event evaluation"
    - framework: "ISO 27001"
      control_ids: ["A.8.15", "A.8.16"]
      description: "Logging and monitoring activities"

  cloud_k8s:
    - framework: "OWASP Top 10 2025"
      control_ids: ["A01:2025 - Broken Access Control", "A02:2025 - Security Misconfiguration"]
      description: "RBAC misconfigurations are access control failures; privileged pods are security misconfigurations"
    - framework: "PCI-DSS v4.0.1"
      control_ids: ["2.2.1", "7.2.1", "6.2.4"]
      description: "Configuration standards, access restrictions, and secure container deployment"
    - framework: "SOC 2"
      control_ids: ["CC6.1", "CC6.3", "CC7.1"]
      description: "Logical access, role-based access, and container orchestration monitoring"
    - framework: "ISO 27001"
      control_ids: ["A.8.2", "A.8.9", "A.8.20"]
      description: "Privileged access rights, configuration management, and network security"

  cloud_secrets:
    - framework: "OWASP Top 10 2025"
      control_ids: ["A04:2025 - Cryptographic Failures"]
      description: "Hardcoded credentials and missing key rotation are cryptographic failures"
    - framework: "PCI-DSS v4.0.1"
